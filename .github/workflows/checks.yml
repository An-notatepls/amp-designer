name: Tests and frozen-input integrity
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.4'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest test_prepare_splits.py -v
      - run: python -m unittest discover -s modeling -p 'test_*.py' -v
      - run: python tools/verify_release.py
      - run: python tools/reproduce_modeling.py --baseline-only
